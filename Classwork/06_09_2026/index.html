<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
function getUserDetails(userId) {
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    if (userId === 1) {
                        resolve({ id: 1, name: 'John Doe' });
                    } else {
                        reject('User not found');
                    }
                }, 1000);
            });
        }

        async function displayUserDetails(userId) {
            try {
                const userDetails = await getUserDetails(userId);
                console.log('User Details:', userDetails);
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // displayUserDetails(1); // Should log user details
        // displayUserDetails(2); // Should log error message

        async function fetchUsers() {
            return await new Promise(resolve => {
                setTimeout(() => {
                    console.log('Fetching users...');
                    resolve(['User1', 'User2', 'User3']);
                }, 1000);
            });
        }

        async function fetchPosts() {
            return await new Promise(resolve => {
                setTimeout(() => {
                    console.log('Fetching posts...');
                    resolve(['Post1', 'Post2', 'Post3']);
                }, 1500);
            }); 
        }

        async function fetchComments() {
            return await new Promise(resolve => {
                setTimeout(() => {
                    console.log('Fetching comments...');
                    resolve(['Comment1', 'Comment2', 'Comment3']);
                }, 2000);
            });
        }

        async function fetchData() {
            const users = await fetchUsers();
            console.log('Users:', users);

            const posts = await fetchPosts();
            console.log('Posts:', posts);

            const comments = await fetchComments();
            console.log('Comments:', comments);
        }

        // fetchData();
        async function fetchDataInParallel() {
            [users, posts, comments] = await Promise.all([fetchUsers(), fetchPosts(), fetchComments()]);

            console.log('Users:', users);
            console.log('Posts:', posts);
            console.log('Comments:', comments);
        }
        fetchDataInParallel();

        async function sayHello() {
            return 'Привіт!';
        }

        sayHello().then(message => {
            console.log(message);
        });

        async function getProcessData() {
            const myPromise = new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve('Дані отримані!');
                }, 2000);
            });

            console.log('Очікування даних...');
            const result = await myPromise;
            console.log(result);
        }

        getProcessData();
    </script>
</body>

</html>
