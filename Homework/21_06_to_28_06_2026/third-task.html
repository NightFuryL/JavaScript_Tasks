<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #222;
        }

        #field {
            width: 100vw;
            height: 100vh;
            background-color: #4caf50;
            position: relative;
            border: 5px solid white;
            box-sizing: border-box;
            cursor: crosshair;
        }

        #center-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: white;
            transform: translateX(-50%);
        }

        #center-circle {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 150px;
            height: 150px;
            border: 4px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        #penalty-left {
            position: absolute;
            left: 0;
            top: 25%;
            width: 15%;
            height: 50%;
            border: 4px solid white;
            border-left: none;
        }

        #goal-left {
            position: absolute;
            left: -20px;
            top: 40%;
            width: 20px;
            height: 20%;
            border: 4px solid white;
        }

        #penalty-right {
            position: absolute;
            right: 0;
            top: 25%;
            width: 15%;
            height: 50%;
            border: 4px solid white;
            border-right: none;
        }

        #goal-right {
            position: absolute;
            right: -20px;
            top: 40%;
            width: 20px;
            height: 20%;
            border: 4px solid white;
        }
        /*Стилі м'яча та плавність його переходу через трансішн*/
        #ball {
            width: 100px;
            height: 100px;
            position: absolute;
            left: 200px;
            top: 200px;
            font-size: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            user-select: none;
            transition: left 0.5s ease-out, top 0.5s ease-out;
        }
    </style>
</head>

<body>
    <div id="field" onclick="moveBall(event)">
        <div id="center-line"></div>
        <div id="center-circle"></div>
        <div id="penalty-left"></div>
        <div id="goal-left"></div>
        <div id="penalty-right"></div>
        <div id="goal-right"></div>
        <div id="ball">⚽</div>
    </div>
    <script src="./JSFiles/third.js"></script>
</body>

</html>
