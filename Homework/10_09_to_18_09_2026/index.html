<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../Resources/General_styles/style1.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--1 - 3-->
    <section class="all-tasks-section">
        <p class="task-number">Ex. num 1-3</p>
        <hr>
        <div class="task">
            <main class="main-container">
                <h2 class="section-title">Search:</h2>
                <form id="search-form" class="search-box">
                    <div class="form-group">
                        <label for="title-input">Title:</label>
                        <input type="text" id="title-input" required autocomplete="off">
                    </div>
        
                    <div class="form-group">
                        <label for="type-select">Type:</label>
                        <select id="type-select">
                            <option value="movie">Movie</option>
                            <option value="series">Series</option>
                            <option value="episode">Episode</option>
                        </select>
                    </div>
        
                    <button type="submit" id="search-btn">Search</button>
                </form>
        
                <div id="films-section" class="hidden">
                    <h2 class="section-title">Films:</h2>
                    <div id="films-container" class="films-grid"></div>
                    <div id="pagination-container" class="pagination"></div>
                </div>
        
                <div id="message-box" class="message-box hidden"></div>
        
        
                <div id="details-section" class="hidden">
                    <h2 class="section-title">Film info:</h2>
                    <div id="details-container" class="details-box"></div>
                </div>
            </main>
        </div>
    </section>

    <script src="JSFiles/scriptApp.js"></script>
</body>

</html>
