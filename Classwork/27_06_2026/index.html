<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../Resources/General_styles/style1.css">
    <style>
        .drop-zone {
            max-width: 400px;
            height: 200px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: sans-serif;
            font-weight: 500;
            font-size: 18px;
            cursor: pointer;
            color: #888;
            border: 4px dashed #ccc;
            border-radius: 10px;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }

        .drop-zone--over {
            border-color: #007bff;
            background-color: rgba(0, 123, 255, 0.1);
            color: #007bff;
        }
    </style>
</head>

<body>
    <section class="form-section">
        <form action="/" method="post" class="form-class" enctype="multipart/form-data">
            <h3>Registration</h3>
            <div>
                <label for="username">Username: </label>
                <input type="text" id="username" name="username" placeholder="Enter your username here"
                    value="guest404">
            </div>
            <div>
                <label for="password">Password: </label>
                <input type="password" name="password" id="password">

            </div>
            <div>
                <label for="about">About me: </label>
                <textarea name="about" id="about" cols="30" rows="10" wrap="hard"></textarea>
            </div>
            <div>
                <label for="avatar">Attach your photo: </label>
                <input type="file" name="avatar" id="avatar">
            </div>
            <div class="drop-zone" id="drop-zone">
                <span class="drop-zone__prompt">Drag & Drop your file here or press to choose from disk</span>
                <input type="file" name="myFile" id="file-input" hidden>
            </div>
            <button type="submit">Send</button>
            <button type="reset">Clear</button>
        </form>
    </section>

    <button id="color-btn">Press me !</button>
    <script>
        function getRandomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1) + min);
        }
        function getRandomColor() {
            const min = 0;
            const max = 255;
            const red = getRandomNumber(min, max);
            const green = getRandomNumber(min, max);
            const blue = getRandomNumber(min, max);
            return `rgb(${red}, ${green}, ${blue})`;
        }
        document.addEventListener("DOMContentLoaded", () => {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const promptText = document.querySelector(".drop-zone__prompt");

            dropZone.addEventListener("click", () => {
                fileInput.click();
            });

            ['dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, event => {
                    event.preventDefault();
                })
            });

            dropZone.addEventListener('dragover', () => {
                dropZone.classList.add('drop-zone--over');
            });

            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('drop-zone--over');
            });

            dropZone.addEventListener('drop', () => {
                dropZone.classList.remove('drop-zone--over');

                if (event.dataTransfer.files.length) {
                    fileInput.files = event.dataTransfer.files;
                }
                updatePrompt(fileInput.files[0].name);
            })

            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) {
                    updatePrompt(fileInput.files[0].name);
                }
            });

            function updatePrompt(text) {
                promptText.textContent = `Attached: ${text}`;
            }

            const form = document.querySelector('form');
            form.addEventListener("submit", (event) => {
                event.preventDefault();

                const input = document.getElementById('username');
                console.log(input.value);

                const formData = new FormData(form);

                const data = Object.fromEntries(formData.entries());

                //send to server
                console.log(data);
            })

            const btnColor = document.getElementById("color-btn");
            btnColor.addEventListener("click", (event) => {
                event.target.style.backgroundColor = getRandomColor();
            });
        })
    </script>
</body>

</html>
